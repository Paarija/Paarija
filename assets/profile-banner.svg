<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Parija Nath - data science and applied machine learning</title>
  <desc id="desc">A dark blue banner with a rising data chart and the words From raw data to reasoned decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10172e"/>
      <stop offset="0.55" stop-color="#152d49"/>
      <stop offset="1" stop-color="#254667"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ce1e6"/>
      <stop offset="1" stop-color="#aa88ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="35" r="155" fill="#7659ca" opacity="0.16" filter="url(#glow)"/>
  <circle cx="670" cy="290" r="155" fill="#35c6db" opacity="0.13" filter="url(#glow)"/>

  <g fill="none" stroke="#b7d8ef" stroke-opacity="0.12" stroke-width="1">
    <path d="M740 45H1155M740 95H1155M740 145H1155M740 195H1155M740 245H1155"/>
    <path d="M760 35V260M840 35V260M920 35V260M1000 35V260M1080 35V260"/>
  </g>

  <text x="65" y="62" fill="#68d9e4" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PARIJA NATH  /  DATA SCIENCE</text>
  <text x="65" y="133" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="700">From raw data</text>
  <text x="65" y="195" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="700">to reasoned decisions.</text>
  <rect x="65" y="218" width="98" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="65" y="257" fill="#c9d9e9" font-family="Segoe UI, Arial, sans-serif" font-size="19">Predictive modeling  ·  NLP  ·  Explainability</text>

  <g opacity="0.8">
    <rect x="772" y="188" width="30" height="61" rx="5" fill="#5683a5"/>
    <rect x="830" y="162" width="30" height="87" rx="5" fill="#5683a5"/>
    <rect x="888" y="179" width="30" height="70" rx="5" fill="#5683a5"/>
    <rect x="946" y="125" width="30" height="124" rx="5" fill="#5683a5"/>
    <rect x="1004" y="140" width="30" height="109" rx="5" fill="#5683a5"/>
    <rect x="1062" y="91" width="30" height="158" rx="5" fill="#5683a5"/>
  </g>
  <path d="M787 176L845 153L903 164L961 113L1019 121L1077 74" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#80edf0" stroke="#17334a" stroke-width="4">
    <circle cx="787" cy="176" r="7"/>
    <circle cx="845" cy="153" r="7"/>
    <circle cx="903" cy="164" r="7"/>
    <circle cx="961" cy="113" r="7"/>
    <circle cx="1019" cy="121" r="7"/>
    <circle cx="1077" cy="74" r="7"/>
  </g>
  <circle cx="1120" cy="234" r="7" fill="#ad8bff" opacity="0.9"/>
  <circle cx="735" cy="83" r="4" fill="#80edf0" opacity="0.8"/>
</svg>
